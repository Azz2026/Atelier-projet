services:
  - type: web
    name: cabinet-adeiz-site
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: cabinet-adeiz-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
